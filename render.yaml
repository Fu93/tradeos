# Render Blueprint. Secrets are prompted for in the dashboard (sync: false).
services:
  - type: web
    name: tradeos
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: PAYPAL_WEBHOOK_ID          # from scripts/register_webhook.py (not secret, but env-only)
        sync: false
      - key: CHANNEL3_API_KEY           # optional: real products for agents (find_product); empty = demo sneakers only
        sync: false
      - key: TRADEOS_TRUST_CF_CONNECTING_IP
        value: "1"                      # Render sits behind Cloudflare's edge; off by default elsewhere
      - key: TRADEOS_DB_PATH
        value: /tmp/tradeos.db
      - key: TRADEOS_RESET_ON_START
        value: "1"
