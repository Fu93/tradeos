name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: pip-audit re-runs against whatever advisories shipped that week
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
      - run: pip install -r requirements-dev.lock
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy app
      - name: "Tests (offline, mock PayPal, no LLM) with a coverage gate"
        env:
          PAYPAL_MOCK: "1"
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
      - run: pip install -r requirements.lock pip-audit
      - name: Dependency audit (pip-audit)
        run: pip-audit --strict
